[project]
name = "own-xray"
version = "0.1.0"
description = "Terminal-first Xray management panel"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
xraydo = "xraydo.cli:main"

[tool.setuptools.package-data]
xraydo = ["locales/*.json", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
