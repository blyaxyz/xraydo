[project]
name = "own-xray"
version = "0.1.0"
description = "Terminal-first Xray management panel"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
xraydo = "xraydo.cli:main"

[tool.setuptools.package-data]
xraydo = ["locales/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
