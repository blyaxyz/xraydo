name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check .
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Require HTTPS and mTLS network tests
        if: matrix.python == '3.14'
        run: PYTHONPATH=src python scripts/run_network_tests.py

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash -n install.sh
      - run: bash tests/test_install.sh
      - run: ./install.sh --dry-run --non-interactive
      - run: PYTHONPATH=src XRAYDO_DATA_DIR=/tmp/xraydo-smoke python3 -m xraydo.cli --json status

  support-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: generate
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("src/xraydo/data/support_matrix.json", encoding="utf-8"))
          include = []
          for distro in data["distributions"]:
              for architecture in data["architectures"]:
                  include.append({
                      "name": distro["name"], "channel": distro["channel"],
                      "image": distro["image"], "platform": architecture,
                  })
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          PY

  linux-compatibility:
    needs: support-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: ${{ matrix.name }} / ${{ matrix.platform }} / ${{ matrix.channel }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        if: matrix.platform == 'linux/arm64'
      - name: Test declared platform
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            --volume "$PWD:/workspace" --workdir /workspace \
            '${{ matrix.image }}' sh -c \
            'apt-get update >/dev/null && apt-get install -y --no-install-recommends bash >/dev/null; exec bash scripts/ci-platform-smoke.sh'
